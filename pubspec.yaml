name: tithi
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+7
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # jyotish: ^1.0.1
  jyotish:
    path: packages/jyotish
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  http: ^1.2.0
  google_fonts: ^6.3.3
  package_info_plus: ^9.0.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.1 # FOSS: Uses native LocationManager with forceAndroidLocationManager
  nominatim_geocoding: ^0.0.6 # FOSS: OpenStreetMap Nominatim API for reverse geocoding
  flutter_local_notifications: ^19.0.0 # FOSS: Native notifications, no GMS required
  timezone: ^0.10.0 # For scheduling notifications at specific times
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  path: ^1.9.1
  flutter_map_geojson2: ^1.0.2
  flutter_map_tile_caching: ^10.1.1

  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  screenshot: ^3.0.0
  uuid: ^4.5.2
  workmanager: ^0.9.0+3
  flutter_displaymode: ^0.7.0
  flutter_timezone: ^3.0.0
  home_widget: ^0.9.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  dep_audit: ^0.1.9

# The following section is specific to Flutter packages.
flutter:
  generate: true # Enable localization code generation
  uses-material-design: true

  assets:
    - assets/ephe/
    - assets/festivals.json
    - assets/data/shlokas.json
    - assets/images/
    - assets/icons/
    - assets/map_data/

