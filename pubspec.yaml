name: tithi
description: "A new Flutter project."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # jyotish: ^1.0.1
  jyotish:
    path: packages/jyotish
  flutter_riverpod: ^3.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  google_fonts: ^6.3.3
  package_info_plus: ^9.0.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.1 # FOSS: Uses native LocationManager with forceAndroidLocationManager
  nominatim_geocoding: ^0.0.6 # FOSS: OpenStreetMap Nominatim API for reverse geocoding
  flutter_local_notifications: ^19.0.0 # FOSS: Native notifications, no GMS required
  timezone: ^0.10.0 # For scheduling notifications at specific times

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/ephe/
    - assets/festivals.json

