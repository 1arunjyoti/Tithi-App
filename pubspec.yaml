name: tithi
description: "A new Flutter project."
publish_to: "none"
version: 0.9.1+29
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # jyotish: ^1.0.1
  jyotish:
    path: packages/jyotish
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  http: ^1.2.0
  crypto: ^3.0.7 # SHA-256 verification of downloaded update APKs
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.1 # FOSS: Uses native LocationManager with forceAndroidLocationManager
  nominatim_geocoding: ^0.0.6 # FOSS: OpenStreetMap Nominatim API for reverse geocoding
  flutter_local_notifications: ^22.3.2 # FOSS: Native notifications, no GMS required
  timezone: ^0.11.2 # For scheduling notifications at specific times
  timezone_finder: ^1.0.0 # Offline coordinate -> IANA zone (ODbL boundaries)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  path: ^1.9.1
  flutter_map_geojson2: ^1.0.2

  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  screenshot: ^3.0.0
  uuid: ^4.5.2
  workmanager: ^0.10.10
  flutter_displaymode: ^0.7.0
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.3
  file_picker: ^13.1.0
  scrollable_positioned_list: ^0.3.8
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  dep_audit: ^0.1.9
  plugin_platform_interface: ^2.1.8 # location fallback tests (platform fake)

# The following section is specific to Flutter packages.
flutter:
  generate: true # Enable localization code generation
  uses-material-design: true

  assets:
    - assets/ephe/
    - assets/festivals.json
    - assets/data/shlokas.json
    - assets/data/in_city.json
    - assets/images/
    - assets/images/festival/
    - assets/icons/
    - assets/map_data/
    - assets/licenses/

  # Bundled cross-script type system. Fonts are shipped, never fetched at
  # runtime (privacy/offline): see lib/theme/app_typography.dart for the
  # fallback chains and the three tiers. Keep family names in sync with
  # AppTypography.*Family.
  fonts:
    # Tier 1 - Latin editorial serif.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Bold.ttf
          weight: 700
        - asset: assets/fonts/Newsreader-RegularItalic.ttf
          style: italic
        - asset: assets/fonts/Newsreader-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Newsreader-BoldItalic.ttf
          weight: 700
          style: italic
    # Tier 1 - Indic editorial serifs (Tiro, one design DNA).
    - family: TiroDevanagariHindi
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
        - asset: assets/fonts/TiroDevanagariHindi-RegularItalic.ttf
          style: italic
    - family: TiroDevanagariSanskrit
      fonts:
        - asset: assets/fonts/TiroDevanagariSanskrit-Regular.ttf
        - asset: assets/fonts/TiroDevanagariSanskrit-RegularItalic.ttf
          style: italic
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
        - asset: assets/fonts/TiroBangla-RegularItalic.ttf
          style: italic
    - family: TiroTamil
      fonts:
        - asset: assets/fonts/TiroTamil-Regular.ttf
        - asset: assets/fonts/TiroTamil-RegularItalic.ttf
          style: italic
    - family: TiroTelugu
      fonts:
        - asset: assets/fonts/TiroTelugu-Regular.ttf
        - asset: assets/fonts/TiroTelugu-RegularItalic.ttf
          style: italic
    - family: NotoSerifMalayalam
      fonts:
        - asset: assets/fonts/NotoSerifMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSerifMalayalam-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifMalayalam-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifMalayalam-Bold.ttf
          weight: 700
    # Tier 2 - Latin UI sans.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Tier 2 - Indic UI sans (uniform stroke, clean conjuncts).
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMalayalam-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    # Tier 3 - technical/monospaced-feel Latin.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
