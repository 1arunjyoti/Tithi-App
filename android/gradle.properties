# Gradle 9 + AGP 9 + KGP 2.3 need more metadata headroom than the old
# 512m: release builds OOM (Metaspace) in :workmanager_android's
# lintVitalAnalyzeRelease otherwise.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin must stay ON under AGP 9: workmanager_android 0.9.3 skips
# `apply plugin: 'kotlin-android'` when AGP >= 9 and relies on built-in
# Kotlin instead. With false its sources silently don't compile
# (GeneratedPluginRegistrant then fails with missing WorkmanagerPlugin).
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# KGP 2.3's incremental cache cannot relativize plugin sources that live on
# a different drive than the project (pub cache on C:, project on D:) and
# fatally fails with "this and base files have different roots" instead of
# falling back like KGP 2.2 did. Disable incremental Kotlin compilation
# until fixed upstream; costs some build speed, buys correct builds.
kotlin.incremental=false
