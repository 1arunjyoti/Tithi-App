group 'com.rajsanjib.jyotish'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9 provides built-in Kotlin: applying 'kotlin-android' is a hard
// error (and the KGP classpath with it), so both are gone. The kotlin {}
// compilerOptions block went with them (that extension belongs to KGP);
// built-in Kotlin follows the Java 17 compileOptions below.
apply plugin: 'com.android.library'

android {
    namespace 'com.rajsanjib.jyotish'
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21

        // Configure CMake for native build
        externalNativeBuild {
            cmake {
                cppFlags ""
                // Build for common Android architectures
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
        
        // Specify ndk settings
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // External native build configuration
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
}
